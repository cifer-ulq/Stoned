services:
  - type: web
    name: hireme-api
    runtime: docker
    dockerfilePath: ./hireme-api/Dockerfile
    dockerContext: ./hireme-api
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "CHMSU HireMe"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
